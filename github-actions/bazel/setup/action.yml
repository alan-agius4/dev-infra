    #       $BAZEL_CACHE_PATH_UNIX = wsl.exe wslpath -u "$BAZEL_CACHE_PATH"
    #     }

    #     echo "BAZEL_CACHE_PATH_UNIX is: $BAZEL_CACHE_PATH_UNIX"
    #     echo "BAZEL_CACHE_PATH is: $BAZEL_CACHE_PATH"

    #     # Pass variables as arguments. PowerShell won't perform the same path translation.
    #     node "$GITHUB_ACTION_PATH/setup-ci-bazelrc.mjs" "${{ inputs.bazelrc }}" "$BAZEL_CACHE_PATH_UNIX" "$BAZEL_CACHE_PATH

    # - name: Setup CI bazelrc config (Linux)
    #   shell: bash
    #   if: runner.os != 'Windows'
    #   run: |
    #     BAZEL_CACHE_PATH="$HOME/.cache/bazel_repo_cache"
    #     BAZEL_CACHE_PATH_UNIX="$BAZEL_CACHE_PATH"

    #     echo "BAZEL_CACHE_PATH_UNIX is: $BAZEL_CACHE_PATH_UNIX"
    #     echo "BAZEL_CACHE_PATH is: $BAZEL_CACHE_PATH"

    #     node "$GITHUB_ACTION_PATH/setup-ci-bazelrc.mjs" "${{ inputs.bazelrc }}" "$BAZEL_CACHE_PATH_UNIX" "$BAZEL_CACHE_PATH

    - name: Configure action caching for bazel repository cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ~/.cache/bazel_repo_cache
        key: bazel-cache-${{ runner.os }}-${{ hashFiles('**/WORKSPACE') }}-${{ hashFiles('**/MODULE.bazel') }}
        restore-keys: |
          bazel-cache-${{ runner.os }}-
