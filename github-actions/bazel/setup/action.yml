name: 'Setup Bazel'
description: 'Setup and configure bazel for CI use'
author: 'Angular'

inputs:
  bazelrc:
    default: .bazelrc.user
    description: |
      The `bazelrc` file location to add the `repository_cache` flag to. Defaults
      to .bazelrc.user
runs:
  using: composite
  steps:
    - name: Configure action caching for bazel version downloaded by bazelisk
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ~/.cache/bazelisk
          ~/AppData/Local/bazelisk
        key: bazel-version-${{ hashFiles('**/.bazelversion') }}

    - name: Setup CI bazelrc config
      shell: bash
      run: |
        BAZEL_CACHE_PATH="$HOME/.cache/bazel_repo_cache"
        BAZELRC_PATH="${{ inputs.bazelrc }}"

        # Create the directory. `mkdir -p` works on both Linux and the bash shell on Windows.
        mkdir -p "$BAZEL_CACHE_PATH"

        # Check for WSL on Windows and convert the path if necessary
        if [[ "${{ runner.os }}" == "Windows" ]]; then
          if command -v wsl.exe &> /dev/null; then
            echo "Detected WSL on Windows. Converting cache path to Unix format."
            BAZEL_CACHE_PATH=$(wsl.exe wslpath -u "$BAZEL_CACHE_PATH")
          fi
        fi

        # Append the configuration to the bazelrc file
        cat <<EOT >> "$BAZELRC_PATH"
        # Print all the options that apply to the build.
        build --announce_rc

        # Avoids re-downloading NodeJS/browsers all the time.
        build --repository_cache=$BAZEL_CACHE_PATH

        # More details on failures
        build --verbose_failures=true

        # CI supports colors but Bazel does not detect it.
        common --color=yes
        EOT

    # - name: Setup CI bazelrc config (Windows)
