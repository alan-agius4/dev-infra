name: 'Setup Bazel'
description: 'Setup and configure bazel for CI use'
author: 'Angular'

inputs:
  bazelrc:
    default: .bazelrc.user
    description: |
      The `bazelrc` file location to add the `repository_cache` flag to. Defaults
      to .bazelrc.user

outputs:
  bazel_repo_cache_path:
    description: The Bazel repo cache path.
    value: ${{steps.setup_bazel.outputs.bazel_repo_cache_path}}

runs:
  using: composite
  steps:
    - name: Configure action caching for bazel version downloaded by bazelisk
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ~/.cache/bazelisk
          ~/AppData/Local/bazelisk
        key: bazel-version-${{ hashFiles('**/.bazelversion') }}

    - name: Setup CI bazelrc config
      id: setup_bazel
      shell: ${{ runner.os == 'Windows' && 'wsl-bash {0}' || 'bash' }}
      env:
        WSLENV: ${{ runner.os == 'Windows' && 'GITHUB_OUTPUT/p' || '' }}
      run: |
        bazel_repo_cache_path=~/.cache/bazel_repo_cache
        echo "bazel_repo_cache_path=$bazel_repo_cache_path" >> $GITHUB_OUTPUT

        # Run the setup script
        ./setup-bazel.sh "${{ inputs.bazelrc }}" "$bazel_repo_cache_path"

    - name: Configure action caching for bazel repository cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: ${{ steps.setup_bazel.outputs.bazel_repo_cache_path }}
        key: bazel-cache-${{ runner.os }}-${{ hashFiles('**/WORKSPACE') }}-${{ hashFiles('**/MODULE.bazel') }}
        restore-keys: |
          bazel-cache-${{ runner.os }}-
